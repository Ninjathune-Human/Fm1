# Essai : Felucca compilé depuis ses sources pour le navigateur (son web/emu, Emscripten),
# mesuré contre le même Felucca exécuté par le cœur émulé fm1-emu, sur la même machine.
name: Natif

on:
  push:
    branches: [natif]
  workflow_dispatch:

permissions:
  contents: write

env:
  FELUCCA_COMMIT: a53ecf428c29c780108fd70a31b71a32a6b5c313
  EMSDK_VERSION: 3.1.64
  NATIF_TAG: natif-felucca-a53ecf4

jobs:
  felucca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: hugelton/Felucca
          ref: ${{ env.FELUCCA_COMMIT }}
          path: felucca

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: En-têtes générés (polices, tables, échantillons)
        working-directory: felucca
        run: |
          pip install pillow fonttools
          python3 -c "import importlib.util as u; s=u.spec_from_file_location('b','tools/build.py'); b=u.module_from_spec(s); s.loader.exec_module(b); b.generate()"
          ls build/gen

      - name: Compilation navigateur
        working-directory: felucca
        run: EMU_PREVIEW=0 sh web/emu/build.sh

      - name: Tests et coût de Felucca natif
        working-directory: felucca
        run: BENCH_MAX=5 node web/emu/emu_test.mjs build/emu/felucca.wasm | tee ../natif-test.txt

      - name: Coût de Felucca émulé (fm1-emu), même machine
        run: |
          git clone -q https://github.com/joakimeriksson/fm1-emu.git fm1-emu
          git -C fm1-emu checkout -q 1c8661daa1bbfddbb7d32d927bbaf831343b7d3b
          curl -sSLf -o fm1_web.wasm https://github.com/${{ github.repository }}/releases/download/runtime-1c8661d/fm1_web.wasm
          FM1_WASM=$PWD/fm1_web.wasm FM1_FWSC=$PWD/firmwares/felucca.fwsc node fm1-emu/web/bench.mjs 100 6 | tee emule-bench.txt

      - name: Résumé
        run: |
          { echo '### Felucca natif'; echo '```'; grep -iE "cost|real time|fail|ok$" natif-test.txt | tail -15; echo '```';
            echo '### Felucca émulé (fm1-emu, 100 MHz)'; echo '```'; head -1 emule-bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cp felucca/build/emu/felucca.wasm felucca/build/emu/worklet.js natif-test.txt emule-bench.txt out/
          cp felucca/LICENSE out/LICENSE-felucca.txt
          gh release view "$NATIF_TAG" >/dev/null 2>&1 || gh release create "$NATIF_TAG" --target "$GITHUB_SHA" \
            --title "Felucca natif (a53ecf4)" --notes "Felucca (GPL-3.0, Hügelton Instruments) compilé depuis ses sources pour le navigateur."
          gh release upload "$NATIF_TAG" out/* --clobber
