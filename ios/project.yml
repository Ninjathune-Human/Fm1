# Le projet Xcode de l'app iPad, généré par XcodeGen (action GitHub iPad) ; www est le site publié.
name: FM1
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  FM1:
    type: application
    platform: iOS
    sources:
      - FM1.swift
      - path: midi.js
        buildPhase: resources
      - Assets.xcassets
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ninjathune-human.fm1
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
