# L'app iPad : le site publié, embarqué dans une WKWebView (ios/), compilé en FM1.ipa non signé pour Sideloadly
# (qui le signe avec l'identifiant Apple de l'utilisateur). Vérifiée d'abord dans le simulateur iPad ; sur main,
# jointe à la version « ipad », dont le tag suit le commit publié, et, avec les secrets ASC_*, signée et envoyée
# sur TestFlight.
name: iPad

on:
  workflow_run:                  # après chaque publication du site
    workflows: [Site]
    types: [completed]
    branches: [main]
  push:                          # une branche d'essai de l'app : compilée et vérifiée, pas publiée
    branches-ignore: [main]
    paths: [ios/**, .github/workflows/ipad.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# (une exécution Site annulée ou en échec déclenche une exécution ignorée : à part, elle n'annule pas une compilation)
concurrency:
  group: ipad-${{ github.ref }}-${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'compile' || 'ignore' }}
  cancel-in-progress: true

jobs:
  ipad:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel        # les Mac arm64 de GitHub, saturés, ne prenaient plus les tâches
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUNDLE: io.github.ninjathune-human.fm1
      HOMEBREW_NO_AUTO_UPDATE: 1
      TESTFLIGHT: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Le site, tel que publié
        run: |
          RUN="${{ github.event.workflow_run.id }}"
          [ -n "$RUN" ] || RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n github-pages -D site 2> dl.log \
            || { echo "::error title=site::artefact du site de l'exécution $RUN (gardé un jour, sinon relancer Site) : $(tr '\n' ' ' < dl.log)"; exit 1; }
          mkdir www && tar -xf site/artifact.tar -C www
          du -sh www

      - name: Compilation
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
          for sdk in iphonesimulator iphoneos; do   # les erreurs en annotation (lisibles sans les journaux)
            xcodebuild -project FM1.xcodeproj -target FM1 -configuration Release -sdk "$sdk" SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO -quiet build > build.log 2>&1 \
              || { echo "::error title=compilation $sdk::$(grep -E 'error:' build.log | head -10 | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"; exit 1; }
          done

      - name: MIDI, sur le Mac (MIDIEntrees et un clavier virtuel)
        run: |
          xcrun swiftc -parse-as-library MIDIEntrees.swift clavier-test.swift -o build/clavier-test > clavier.log 2>&1 \
            || { echo "::error title=clavier test::$(grep 'error:' clavier.log | head -5 | tr '\n' ' ')"; exit 1; }
          r=$(build/clavier-test) && echo "::notice title=clavier test::$r" || { echo "::error title=clavier test::$r"; exit 1; }

      - name: Vérification dans le simulateur
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if '.iOS-' in r for x in d[r] if x['name'].startswith('iPad')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          APP=build/Release-iphonesimulator/FM1.app
          codesign --force --sign - "$APP"
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_FM1_DIAGNOSTIC="$(cat diagnostic.js)" xcrun simctl launch "$UDID" "$BUNDLE"
          OUT="$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)/Documents/diagnostic.txt"
          for i in $(seq 120); do [ -s "$OUT" ] && break; sleep 1; done
          sleep 5
          xcrun simctl io "$UDID" screenshot capture.png
          cp "$OUT" diagnostic.txt || echo "aucun diagnostic" > diagnostic.txt
          cat diagnostic.txt; echo
          python3 - <<'EOF'
          import json
          try:
              r = json.load(open("diagnostic.txt"))
          except ValueError:
              print("::error title=simulateur::" + open("diagnostic.txt").read().replace("\n", " ")); raise SystemExit(1)
          attendu = {"securise": True, "page": "object", "compile": "ok", "module": "ok", "worklet": "ok", "absent": 404}
          faux = [k for k, v in attendu.items() if r.get(k) != v] + [k for k in ("coeur", "natifs") if not (isinstance(r.get(k), int) and r[k] > 0)]
          faux += ["midi"] if str(r.get("midi")).startswith("échec") else []
          print(("::error" if faux else "::notice") + " title=simulateur::" + ", ".join(f"{k} = {v}" for k, v in r.items()))
          raise SystemExit(1 if faux else 0)
          EOF

      - name: FM1.ipa
        run: |
          mkdir Payload && cp -R build/Release-iphoneos/FM1.app Payload/
          zip -qry FM1.ipa Payload
          ls -la FM1.ipa

      - name: Version ipad
        if: github.ref == 'refs/heads/main'
        run: |
          gh release view ipad -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ipad -R "$GITHUB_REPOSITORY" --target "$SHA" --latest=false --title "FM-1 pour iPad" \
              --notes "FM1.ipa : l'émulateur FM-1 en app iPad, non signée, à installer avec Sideloadly (qui la signe avec votre identifiant Apple). Recompilée à chaque publication du site ; le tag ipad suit le commit publié."
          gh release upload ipad FM1.ipa -R "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/ipad" -f sha="$SHA" -F force=true

      # TestFlight : l'app signée (compte Apple Developer, par la seule clé d'API) et envoyée à App Store Connect.
      # Sans les trois secrets ASC_*, l'étape est sautée et rien d'autre ne change.
      - name: TestFlight
        if: github.ref == 'refs/heads/main' && env.TESTFLIGHT == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          erreur() { echo "::error title=testflight $1::$(grep -E "${3:-error|Error}" "$2" | head -8 | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"; exit 1; }
          # Xcode 26 au moins : App Store Connect refuse une app compilée avec un SDK plus ancien
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error title=testflight::aucun Xcode 26 sur ce Mac"; exit 1; }
          export DEVELOPER_DIR="$X/Contents/Developer"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > asc.p8

          # la clé privée du certificat : créée au premier envoi, gardée dans la version « signature », chiffrée
          # par un mot de passe tiré de la clé d'API (une clé d'API changée en fait créer une autre)
          MDP=$(grep -v -- ----- asc.p8 | tr -d ' \n' | shasum -a 256 | cut -d' ' -f1); export MDP
          if gh release view signature -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx cle.enc; then
            gh release download signature -p cle.enc -R "$GITHUB_REPOSITORY"
          fi
          if ! { [ -f cle.enc ] && openssl pkcs8 -in cle.enc -passin env:MDP -out cle.pem 2>/dev/null; }; then
            openssl genrsa -out cle.pem 2048 2>/dev/null
            openssl pkcs8 -topk8 -v2 aes-256-cbc -in cle.pem -passout env:MDP -out cle.enc
            gh release view signature -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create signature -R "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --title "Signature de l'app iPad" \
                --notes "cle.enc : la clé privée du certificat de distribution de l'app iPad, chiffrée par la clé d'API App Store Connect (action iPad, étape TestFlight)."
            gh release upload signature cle.enc -R "$GITHUB_REPOSITORY" --clobber
          fi

          # le certificat et le profil, par l'API ; puis un trousseau pour codesign
          python3 testflight.py > tf.log 2>&1 || { echo "::error title=testflight API::$(tail -3 tf.log | tr '\n' ' ')"; exit 1; }
          cat tf.log
          . ./signature.env
          openssl x509 -inform der -in cert.cer -out cert.pem
          P12=$(openssl rand -hex 16); KCP=$(openssl rand -hex 16); KC="$RUNNER_TEMP/fm1.keychain-db"
          /usr/bin/openssl pkcs12 -export -inkey cle.pem -in cert.pem -out cert.p12 -passout pass:"$P12"   # LibreSSL : un .p12 que security lit
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o wwdr.cer && security import wwdr.cer -k "$KC" || true
          security import cert.p12 -k "$KC" -P "$P12" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp profil.mobileprovision "$d/$PROFIL.mobileprovision"
          done

          # l'archive (le numéro de build suit les exécutions), puis l'export qui l'envoie à App Store Connect
          xcodebuild -version
          xcodebuild archive -project FM1.xcodeproj -scheme FM1 -configuration Release -sdk iphoneos \
            -archivePath build/FM1.xcarchive CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIL" OTHER_CODE_SIGN_FLAGS="--keychain $KC" -quiet > archive.log 2>&1 \
            || erreur archive archive.log
          cat > export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PROFIL</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/FM1.xcarchive -exportOptionsPlist export.plist -exportPath build/testflight \
            -allowProvisioningUpdates -authenticationKeyPath "$PWD/asc.p8" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 || erreur envoi export.log 'error|Error|failed'
          echo "::notice title=testflight::build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT envoyé à App Store Connect (équipe $TEAM)"

      # la capture et le diagnostic de la dernière vérification, lisibles sans accès aux artefacts
      - name: Version ipad-verification
        if: ${{ !cancelled() }}
        run: |
          gh release view ipad-verification -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ipad-verification -R "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --title "Vérification de l'app iPad" \
              --notes "La dernière vérification de l'app dans le simulateur iPad (action iPad) : capture d'écran et diagnostic."
          for f in capture.png diagnostic.txt; do
            if [ -f "$f" ]; then gh release upload ipad-verification "$f" -R "$GITHUB_REPOSITORY" --clobber; fi
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ipad
          path: |
            ios/capture.png
            ios/diagnostic.txt
            ios/FM1.ipa
          if-no-files-found: warn
