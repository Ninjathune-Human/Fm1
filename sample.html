/* Mise en page : celle de la page du FM-1 (index.html), pour un module de la même famille. */
:root {
  --bg: #f5f5f7; --surface: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --rule: #d2d2d7; --accent: #2b7865;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
}
@media (prefers-color-scheme: dark) { :root { --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6; --rule: #2c2c2e; --accent: #9fd4c4; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.47 var(--body); -webkit-font-smoothing: antialiased;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
.mast { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.mark { font: 600 clamp(2rem, 5vw, 2.75rem)/1.05 var(--display); letter-spacing: -0.025em; margin: 0; }
.mark span { color: var(--accent); }
.mast .seg { margin-left: auto; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.seg button { min-height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: none; font: 500 0.9375rem var(--body); color: var(--muted); cursor: pointer; }
.seg button { display: inline-flex; align-items: center; gap: 8px; }
.seg button[aria-checked="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.15); }
.seg .beat { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
.seg .beat.on { background: var(--accent); }
.frame { min-width: 0; padding-block: 8px 28px; }
.device { position: relative; isolation: isolate; width: 100%; aspect-ratio: 1640 / 990; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; touch-action: none; --led: #a3d6c7; }
.device::before { content: ""; position: absolute; z-index: -1; inset: 3% 2% 0.5%; border-radius: 6% / 10%;
  box-shadow: 0 46px 70px -18px rgb(0 0 0 / 0.42), 0 18px 26px -10px rgb(0 0 0 / 0.38), 0 3px 6px rgb(0 0 0 / 0.25); }
.device > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
/* l'écran : une image LCD de 440 x 240, à 1,25 unité du FM-1 par pixel */
.device canvas { position: absolute; left: 28.476%; top: 11.616%; width: 32.073%; height: 30.303%; background: #000; border-radius: 0.4%; touch-action: none; }
.glass { position: absolute; left: 25.732%; top: 7.071%; width: 37.561%; height: 39.394%; border-radius: 8.12% / 12.82%; pointer-events: none;
  background:
    linear-gradient(141deg, rgb(255 255 255 / 0.17) 0%, rgb(255 255 255 / 0.075) 35%, rgb(255 255 255 / 0) 35.3%),
    radial-gradient(85% 50% at 22% 0%, rgb(255 255 255 / 0.12), transparent 70%),
    linear-gradient(0deg, rgb(255 255 255 / 0.05), transparent 14%);
  box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.2), inset 0 -3px 8px rgb(0 0 0 / 0.55), inset 0 0 0 1px rgb(255 255 255 / 0.04); }
/* ce qui se touche : les touches, les pads, les molettes, la platine, la zone XY */
#panel .hit { pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; }
#panel [data-knob].hit { cursor: ns-resize; }
#panel .hit:focus-visible .face { filter: drop-shadow(0 0 4px var(--led)); }
.face { transition: transform 70ms var(--ease); }
.cap.held .face { transform: translateY(3.5px); }
.key.held .face { transform: translateY(3px); }
/* la lumière d'une LED (--i, de 0 à 1), comme sur le FM-1 */
@property --i { syntax: "<number>"; inherits: true; initial-value: 0; }
.key, .cap, .led { --i: 0; --lc: #fffdf6; --lg: #ffffff; }
.key.held { --i: 1 !important; }
.key .lamp { opacity: calc(var(--i) * var(--i)); }
.key .core { opacity: min(1, calc(2.2 * var(--i))); }
.key .bloom { opacity: calc(var(--i) * (0.25 + 0.6 * var(--i))); }
.cap.hue-green { --lc: #8dffa4; --lg: #5dff83; }
.cap.hue-red { --lc: #ff5246; --lg: #ff4a3d; }
.cap { --t: clamp(0, calc((var(--i) - 0.35) / 0.35), 1); --f: calc(var(--t) * var(--t) * (3 - 2 * var(--t))); }
.cap .spot { opacity: calc(min(0.6, 1.3 * var(--i)) * (1 - var(--i) * var(--i) * var(--i) * var(--i))); }
.cap .legend { fill: color-mix(in srgb-linear, var(--lc) calc(var(--f) * 100%), var(--cap, #24302d)); }
.cap .legend-bloom { color: var(--lg); opacity: calc(0.5 * var(--f) * var(--i) * var(--i)); }
.led .lit { opacity: var(--i); }
.led .halo { opacity: calc(0.8 * var(--i) * var(--i)); }
/* l'allumage : le bouton sur le verre de l'écran */
.start { position: absolute; inset: 0; border-radius: 5.85% / 9.7%; background: rgb(0 0 0 / 0.08); }
.start[hidden] { display: none; }
.start button { position: absolute; left: 44.51%; top: 26.77%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px;
  font: 600 1rem var(--body); padding: 0 22px 0 18px; min-height: 44px; border-radius: 999px; border: 0; white-space: nowrap;
  background: rgb(255 255 255 / 0.9); color: #1d1d1f; cursor: pointer; box-shadow: 0 10px 28px rgb(0 0 0 / 0.45), inset 0 1px 0 #ffffff; }
.start button svg { width: 16px; height: 16px; }
/* la ligne sous le module : le firmware, les coloris, l'interrupteur */
.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
#fw-picker { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px; max-width: 100%;
  font: 500 0.9375rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; cursor: pointer; }
#fw-picker:hover { border-color: var(--accent); }
.picker-k { color: var(--muted); }
#fw-name { font-weight: 600; }
.notch { flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform-origin: 70% 70%; transform: translate(-2px, -2px) rotate(-45deg); }
.skins { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.skin-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.swatch { width: 44px; height: 44px; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.swatch span { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--a) 0 50%, var(--b) 50% 100%);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.18), 0 1px 2px rgb(0 0 0 / 0.2); }
.swatch[aria-checked="true"] span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: auto; }
#status { font-size: 0.875rem; color: var(--muted); }
#status:empty { display: none; }
.bar button { font: 500 0.9375rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px;
  padding: 0 16px; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
#power { padding: 0 12px 0 14px; }
#power svg { width: 16px; height: 16px; flex: none; }
#power .track { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--rule); transition: background 0.2s var(--ease); }
#power .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.3); transition: transform 0.2s var(--ease); }
#power[aria-checked="true"] .track { background: var(--accent); }
#power[aria-checked="true"] .track::after { transform: translateX(14px); }
/* dans un cadre du Duo : le module en haut, sa ligne dessous, rien d'autre */

<script id="sample-lib">
// Module sample et scratch : les fonctions pures, partagées par la page et son worklet (sans DOM).
"use strict";
const TURN_SECONDS = 1.8;              // un tour de platine : 1,8 s de son, comme un 33 tours
const MAX_SECONDS = 16;                // une capture, au plus
const BARS = [1, 2, 4, 8];             // les longueurs de boucle, en mesures de quatre temps

// le nombre de mesures qui demande le moins de changement de vitesse ; rate = durée du sample / durée de la boucle ;
// au-delà d'une demi-octave, le sample se joue tel quel, sans boucle
function fitBars(seconds, bpm) {
  let best = null;
  for (const bars of BARS) {
    const rate = seconds / ((bars * 4 * 60) / bpm);
    if (!best || Math.abs(Math.log2(rate)) < Math.abs(Math.log2(best.rate))) best = { bars, rate };
  }
  return Math.abs(Math.log2(best.rate)) > 0.5 ? { bars: null, rate: 1 } : best;
}

// n parts égales, de 0 à frames
function sliceBounds(frames, n = 16) {
  const b = new Int32Array(n + 1);
  for (let i = 0; i <= n; i++) b[i] = Math.round((frames * i) / n);
  return b;
}

// un fichier .wav, PCM 16 bits, canaux entrelacés
function encodeWav(channels, sampleRate) {
  const nc = channels.length, frames = channels[0].length, bytes = frames * nc * 2;
  const out = new Uint8Array(44 + bytes), d = new DataView(out.buffer);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out[o + i] = s.charCodeAt(i); };
  str(0, "RIFF"); d.setUint32(4, 36 + bytes, true); str(8, "WAVE");
  str(12, "fmt "); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, nc, true);
  d.setUint32(24, sampleRate, true); d.setUint32(28, sampleRate * nc * 2, true); d.setUint16(32, nc * 2, true); d.setUint16(34, 16, true);
  str(36, "data"); d.setUint32(40, bytes, true);
  for (let i = 0, o = 44; i < frames; i++)
    for (let c = 0; c < nc; c++, o += 2) {
      const v = Math.max(-1, Math.min(1, channels[c][i]));
      d.setInt16(o, v < 0 ? Math.round(v * 32768) : Math.round(v * 32767), true);
    }
  return out;
}

// l'horloge MIDI reçue (24 impulsions par noire) : Start (0xFA) remet à zéro et lance, chaque 0xF8 compte, Stop (0xFC)
// arrête. La phase vient du nombre d'impulsions reçues, jamais du tempo intégré : pas de dérive. Le temps de chaque
// impulsion est lissé par une droite ajustée sur les dernières, qui efface la gigue des messages.
function makeClock() {
  const N = 48, ts = [], ks = [];
  let count = 0;
  const c = {
    running: false, bpm: null,
    fit() {                                           // t ≈ a + b k, aux moindres carrés
      const n = ts.length;
      if (n < 2) return null;
      let sk = 0, st = 0, skk = 0, skt = 0;
      for (let i = 0; i < n; i++) { sk += ks[i]; st += ts[i]; skk += ks[i] * ks[i]; skt += ks[i] * ts[i]; }
      const b = (n * skt - sk * st) / (n * skk - sk * sk);
      return { a: (st - b * sk) / n, b };
    },
    feed(byte, tMs) {
      if (byte === 0xfa) { count = 0; ts.length = 0; ks.length = 0; c.running = true; return; }
      if (byte === 0xfc) { c.running = false; return; }
      if (byte !== 0xf8) return;
      ts.push(tMs); ks.push(count); count++;
      if (ts.length > N) { ts.shift(); ks.shift(); }
      const f = c.fit();
      if (f && f.b > 0) c.bpm = 60000 / (f.b * 24);
    },
    beats(tMs) {                                      // en temps depuis le Start ; au plus une impulsion d'avance
      if (!count) return 0;
      const f = c.fit();
      if (!f || !(f.b > 0)) return (count - 1) / 24;
      const k = (tMs - f.a) / f.b;
      return Math.max(0, Math.min(count, k)) / 24;
    },
  };
  return c;
}

// la durée d'une répétition (roll) en doubles croches
function rollSeconds(bpm) { return 60 / bpm / 4; }
</script>
<script type="text/worklet" id="sample-worklet">
// Le son du module : un AudioWorklet. Il reçoit le texte de sample-lib devant le sien (TURN_SECONDS, rollSeconds…).
// Une boucle calée sur le tempo, la tête qui sonne (scratch, lecture à l'envers, retour en phase), les pads et le roll,
// la coupure, le filtre, l'écho, le volume.
class SampleProc extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ch = null; this.rate = sampleRate; this.frames = 0; this.slices = null; this.bars = null;
    this.cols = Array.from({ length: 16 }, () => ({ start: 0, len: 0, pitch: 0, gain: 100 }));
    this.padBuf = new Array(16).fill(null);
    this.bpm = 120; this.playing = false;
    this.loop = 0;                                    // la boucle, en temps (elle avance toujours, même sous un scratch)
    this.head = 0;                                    // la tête qui sonne, en secondes du sample
    this.vel = 1;                                     // sa vitesse, en secondes du sample par seconde (1 : normale)
    this.mode = "loop";                               // loop, scratch, spin (relâchée : le moteur relance), reverse
    this.target = null; this.lastTarget = null; this.slip = 0;
    this.voices = [];                                 // les pads et les répétitions : { buf, rate, at, end, speed, gain, age }
    this.roll = null;                                 // { i, next }
    this.cut = 0; this.cutTo = 0; this.master = 0.8; this.masterTo = 0.8;
    this.fx = 0.5; this.fy = 0; this.fxTo = 0.5; this.fyTo = 0;
    this.lp = [[0, 0], [0, 0]];                       // le filtre à variable d'état, par canal
    this.echoAmt = 0; this.echoFb = 0; this.echoTo = [0, 0];
    this.dl = [new Float32Array(sampleRate * 2), new Float32Array(sampleRate * 2)]; this.dw = 0;
    this.sent = 0;
    this.port.onmessage = ({ data: m }) => this.msg(m);
  }
  msg(m) {
    switch (m.t) {
      case "load": this.ch = m.ch; this.rate = m.rate; this.frames = m.ch[0].length; this.slices = m.slices; this.bars = m.bars; this.head = 0; this.loop = 0; this.voices = []; break;
      case "play": this.playing = m.on; if (m.on && m.from != null) this.loop = m.from; if (m.on && !this.bars) this.head = 0; break;
      case "sync": {                                   // l'horloge : la boucle se cale sur le temps reçu
        this.bpm = m.bpm || this.bpm;
        const L = this.loopBeats(), want = ((m.beats % L) + L) % L, d = want - this.loop, dd = d - L * Math.round(d / L);
        if (Math.abs(dd) > 0.25) this.loop = want; else this.loop += dd * 0.5;
        break;
      }
      case "bpm": this.bpm = m.bpm; break;
      case "pad": if (m.on) this.trigger(m.i, null); break;
      case "roll": this.roll = m.on ? { i: m.i, next: currentFrame } : null; break;
      case "scratch":
        if (m.pos == null) { if (this.mode === "scratch") this.mode = "spin"; this.target = null; }
        else { this.mode = "scratch"; this.target = m.pos; }
        break;
      case "reverse": if (m.on) this.mode = "reverse"; else if (this.mode === "reverse") this.mode = "spin"; break;
      case "cut": this.cutTo = m.on ? 1 : 0; break;
      case "filter": this.fxTo = m.x; this.fyTo = m.y; break;
      case "echo": this.echoTo = [m.amount, m.feedback]; break;
      case "master": this.masterTo = m.v; break;
      case "slice": this.cols[m.i] = { start: m.start, len: m.len, pitch: m.pitch, gain: m.gain }; break;
      case "unload": this.ch = null; this.frames = 0; this.slices = null; this.voices = []; this.playing = false; break;
      case "padbuf": this.padBuf[m.i] = m.ch ? { ch: m.ch, rate: m.rate } : null; break;
    }
  }
  dur() { return this.frames / this.rate; }
  loopBeats() { return this.bars ? this.bars * 4 : Math.max(1e-3, (this.dur() * this.bpm) / 60); }
  secPerBeat() { return this.dur() / this.loopBeats(); }   // secondes du sample par temps de boucle
  // une tranche, jouée une fois (pad) ou pendant une répétition (roll)
  trigger(i, maxSec) {
    const own = this.padBuf[i];
    if (!own && !this.ch) return;
    const c = this.cols[i], pitch = Math.pow(2, c.pitch / 12);
    let buf, rate, at, end;
    if (own) { buf = own.ch; rate = own.rate; at = 0; end = own.ch[0].length; }
    else {
      buf = this.ch; rate = this.rate;
      at = this.slices[i] + Math.round((c.start / 1000) * rate);
      end = c.len ? at + Math.round((c.len / 1000) * rate) : this.slices[i + 1];
    }
    at = Math.max(0, at); end = Math.min(buf[0].length, end);
    const speed = (rate / sampleRate) * pitch;
    if (maxSec) end = Math.min(end, at + maxSec * rate * pitch);
    this.voices.push({ buf, at, end, speed, gain: c.gain / 100, age: 0 });
    if (this.voices.length > 12) this.voices.shift();
  }
  read(buf, c, p) {                                    // interpolation cubique (Catmull-Rom), hors du sample : silence
    const x = buf[c < buf.length ? c : buf.length - 1], n = x.length, i = Math.floor(p), f = p - i;
    const a = i - 1 >= 0 && i - 1 < n ? x[i - 1] : 0, b = i >= 0 && i < n ? x[i] : 0;
    const cc = i + 1 >= 0 && i + 1 < n ? x[i + 1] : 0, d = i + 2 >= 0 && i + 2 < n ? x[i + 2] : 0;
    return b + 0.5 * f * (cc - a + f * (2 * a - 5 * b + 4 * cc - d + f * (3 * (b - cc) + d - a)));
  }
  svf(x, st, f, q, low) {                              // un pas du filtre à variable d'état (passe-bas ou passe-haut)
    const hp = x - st[0] - q * st[1]; st[1] += f * hp; st[0] += f * st[1];
    return low ? st[0] : hp;
  }
  process(_, outputs) {
    const out = outputs[0], L = out[0], R = out[1] || out[0], n = L.length, sr = sampleRate;
    const dt = 1 / sr, beatsPerSec = this.bpm / 60, has = !!this.ch, oneShot = has && !this.bars;
    // le roll : une répétition à chaque double croche
    if (this.roll && has) {
      while (this.roll.next <= currentFrame + n) { this.trigger(this.roll.i, rollSeconds(this.bpm)); this.roll.next += rollSeconds(this.bpm) * sr; }
    }
    // la tête qui sonne : sa vitesse visée dépend du mode ; un sample sans boucle se joue à sa vitesse, une fois
    const spb = has ? this.secPerBeat() : 0, D = has ? this.dur() : 1, nominal = oneShot ? 1 : beatsPerSec * spb;
    let targetVel;
    if (this.mode === "scratch") {
      let d = this.target - this.head;
      if (has) d -= D * Math.round(d / D);
      targetVel = (d / (n * dt)) * 0.35;               // la main mène la tête, avec un peu d'inertie
    } else if (this.mode === "reverse") targetVel = -nominal;
    else targetVel = this.playing ? nominal : 0;
    const k = this.mode === "scratch" ? 0.5 : 1 - Math.exp(-(n * dt) / 0.06);   // le moteur : ~200 ms pour reprendre sa vitesse
    let ended = false;
    for (let i = 0; i < n; i++) {
      // les rampes douces
      this.cut += (this.cutTo - this.cut) * 0.02;
      this.master += (this.masterTo - this.master) * 0.002;
      this.fx += (this.fxTo - this.fx) * 0.002; this.fy += (this.fyTo - this.fy) * 0.002;
      this.echoAmt += (this.echoTo[0] - this.echoAmt) * 0.002; this.echoFb += (this.echoTo[1] - this.echoFb) * 0.002;
      if (i === 0) this.vel += (targetVel - this.vel) * k;
      if (this.playing && has && !oneShot) { this.loop += beatsPerSec * dt; const lb = this.loopBeats(); if (this.loop >= lb) this.loop -= lb; }
      let l = 0, r = 0;
      if (has && (this.playing || this.mode !== "loop")) {
        this.head += this.vel * dt;
        if (this.head >= D) {
          if (oneShot && this.mode === "loop") { this.playing = false; this.head = 0; this.vel = 0; ended = true; }
          else this.head -= D;
        } else if (this.head < 0) this.head += D;
        if (oneShot) this.loop = this.head / spb;
        const p = this.head * this.rate;
        if (this.playing || this.mode !== "loop") { l = this.read(this.ch, 0, p); r = this.ch.length > 1 ? this.read(this.ch, 1, p) : l; }
        // relâchée : quand le moteur a repris sa vitesse, la tête rejoint la boucle (lecture « slip »)
        if (this.mode === "spin" && this.playing && Math.abs(this.vel - nominal) < 0.02 * nominal + 1e-6) { if (!oneShot) this.head = this.loop * spb; this.mode = "loop"; }
        else if (this.mode === "spin" && !this.playing && Math.abs(this.vel) < 1e-3) this.mode = "loop";
        if (this.mode === "loop" && this.playing && !oneShot) {
          const lh = this.loop * spb;
          this.head += (lh - this.head) * (Math.abs(lh - this.head) < D / 2 ? 0.001 : 1);
        }
      }
      for (let v = 0; v < this.voices.length; v++) {
        const vo = this.voices[v];
        if (vo.at >= vo.end) continue;
        const fade = Math.min(1, vo.age / 64, (vo.end - vo.at) / (vo.speed * 128));
        const sl = this.read(vo.buf, 0, vo.at) * vo.gain * fade;
        l += sl; r += vo.buf.length > 1 ? this.read(vo.buf, 1, vo.at) * vo.gain * fade : sl;
        vo.at += vo.speed; vo.age++;
      }
      // le filtre : passe-bas à gauche, neutre au milieu, passe-haut à droite, la résonance en y
      if (Math.abs(this.fx - 0.5) > 0.002) {
        const low = this.fx < 0.5, u = low ? this.fx / 0.5 : (this.fx - 0.5) / 0.5;
        const fc = low ? 80 * Math.pow(20000 / 80, u) : 20 * Math.pow(8000 / 20, u);
        const f = 2 * Math.sin((Math.PI * Math.min(fc, sr / 6)) / sr), q = 1 / (0.7 + this.fy * 11);
        l = this.svf(l, this.lp[0], f, q, low); r = this.svf(r, this.lp[1], f, q, low);
      }
      // l'écho : au huitième pointé du tempo
      if (this.echoAmt > 0.001 || this.echoFb > 0.001) {
        const len = this.dl[0].length, dly = Math.min(len - 1, Math.round(sr * 0.75 * (60 / this.bpm))), ri = (this.dw - dly + len) % len;
        const el = this.dl[0][ri], er = this.dl[1][ri];
        this.dl[0][this.dw] = l + el * this.echoFb * 0.9; this.dl[1][this.dw] = r + er * this.echoFb * 0.9;
        l += el * this.echoAmt; r += er * this.echoAmt;
      } else { this.dl[0][this.dw] = 0; this.dl[1][this.dw] = 0; }
      this.dw = (this.dw + 1) % this.dl[0].length;
      const g = this.master * (1 - this.cut);
      L[i] = l * g; if (R !== L) R[i] = r * g;
    }
    let w = 0;                                          // les voix finies sortent, sans nouveau tableau
    for (let v = 0; v < this.voices.length; v++) if (this.voices[v].at < this.voices[v].end) this.voices[w++] = this.voices[v];
    this.voices.length = w;
    if (ended) this.port.postMessage({ t: "ended" });
    // ce que les lumières et l'écran montrent, environ 60 fois par seconde
    if (currentFrame - this.sent >= sr / 60) {
      this.sent = currentFrame;
      const beats = has ? this.head / spb : 0, sl = has ? this.sliceAt(this.head * this.rate) : -1;
      this.port.postMessage({ t: "pos", beats, loop: this.loop, slice: sl, disc: (this.head / TURN_SECONDS) * 2 * Math.PI, bpm: this.bpm, playing: this.playing });
    }
    return true;
  }
  sliceAt(f) { const s = this.slices; for (let i = 0; i < 16; i++) if (f < s[i + 1]) return i; return 15; }
}
registerProcessor("sample", SampleProc);
</script>
<script type="text/worklet" id="sample-rec-worklet">
// L'enregistreur du module : armé, il attend un son au-dessus du seuil (ou part aussitôt, seuil à OFF), puis garde ses
// blocs jusqu'à la longueur demandée ou à l'arrêt ; il envoie le niveau d'entrée, et ses blocs par paquets.
class SampleRec extends AudioWorkletProcessor {
  constructor() {
    super();
    this.state = "idle"; this.thresh = null; this.max = 0; this.got = 0; this.buf = []; this.since = 0; this.lvl = 0;
    this.port.onmessage = ({ data: m }) => {
      if (m.t === "arm") { this.state = "armed"; this.thresh = m.thresh; this.max = m.max; this.got = 0; this.buf = []; this.from = m.from == null ? null : m.from; }
      else if (m.t === "stop") this.finish();
    };
  }
  flush() { if (this.buf.length) { this.port.postMessage({ t: "data", blocks: this.buf }); this.buf = []; } }
  finish() { if (this.state === "idle") return; this.flush(); this.state = "idle"; this.port.postMessage({ t: "done", frames: this.got }); }
  process(inputs) {
    const inp = inputs[0];
    if (!inp || !inp.length) return true;
    const n = inp[0].length;
    let peak = 0;
    for (const c of inp) for (let i = 0; i < n; i++) { const a = Math.abs(c[i]); if (a > peak) peak = a; }
    const db = peak > 0 ? 20 * Math.log10(peak) : -Infinity;
    this.lvl = Math.max(db, this.lvl - 1);
    if ((this.since += n) >= sampleRate / 30) { this.since = 0; this.port.postMessage({ t: "level", db: this.lvl }); }
    if (this.state === "armed" && this.from != null) { if (currentFrame + n > this.from) { this.state = "rec"; this.from = null; } }
    else if (this.state === "armed" && (this.thresh == null || db > this.thresh)) this.state = "rec";
    if (this.state === "rec") {
      const take = Math.min(n, this.max - this.got);
      this.buf.push(inp.slice(0, 2).map((c) => c.slice(0, take)));
      this.got += take;
      if (this.buf.length * 128 >= sampleRate / 4) this.flush();
      if (this.got >= this.max) this.finish();
    }
    return true;
  }
}
registerProcessor("sample-rec", SampleRec);
</script>
<script id="sample-panel">
// Module sample et scratch : le panneau, dessiné comme celui du FM-1. Le dessin (matières, molettes, touches, plaques,
// écran, impression en points) reprend buildPanel() d'index.html, lui-même adapté de la page de l'émulateur DUB-1
// (github.com/sbegueria/fm1-dub, GPL-3.0) ; la disposition est celle de la maquette validée (docs/superpowers/specs/
// 2026-11-22-module-sample/maquette.mjs, panel({ kind: "module2" })).
"use strict";
const NS = "http://www.w3.org/2000/svg", VW = 1640, VH = 990;
const QS = new URLSearchParams(location.search), FM1_ID = ["a", "b"].includes(QS.get("fm1")) ? QS.get("fm1") : null;
if (FM1_ID) document.documentElement.classList.add("embed");
const $ = (id) => document.getElementById(id);
const keep = (k, v) => { try { if (v === undefined) return localStorage.getItem("fm1.sample." + k); localStorage.setItem("fm1.sample." + k, v); } catch { return null; } };

// ---------------------------------------------------------------- la langue de la page (l'écran reste en anglais)
const LANG = (() => { try { return localStorage.getItem("fm1.lang") === "en" ? "en" : "fr"; } catch { return "fr"; } })();

// ---------------------------------------------------------------- l'impression du panneau : matrice 5 x 7 (HD44780)
const DOT57 = {
  A: "01110 10001 10001 10001 11111 10001 10001", C: "01110 10001 10000 10000 10000 10001 01110", E: "11111 10000 10000 11110 10000 10000 11111",
  L: "10000 10000 10000 10000 10000 10000 11111", M: "10001 11011 10101 10101 10001 10001 10001", R: "11110 10001 10001 11110 10100 10010 10001",
  S: "01111 10000 10000 01110 00001 00001 11110", T: "11111 00100 00100 00100 00100 00100 00100",
};
const DOT_W = 2.52, DOT_H = 2.62;
function dotMatrixPath(s, cx, top) {
  const runs = []; let lo = Infinity, hi = -Infinity;
  [...s].forEach((ch, i) => (DOT57[ch] || "").split(" ").forEach((row, r) => {
    for (let c = 0; c < 5; c++) {
      if (row[c] !== "1") continue;
      const col = i * 6 + c, last = runs[runs.length - 1];
      if (last && last.r === r && last.c1 === col - 1) last.c1 = col; else runs.push({ r, c0: col, c1: col });
      lo = Math.min(lo, col); hi = Math.max(hi, col);
    }
  }));
  const x0 = cx - ((hi - lo + 1) * DOT_W) / 2 - lo * DOT_W, f = (v) => +v.toFixed(2);
  return runs.map(({ r, c0, c1 }) => `M${f(x0 + c0 * DOT_W)} ${f(top + r * DOT_H)}h${f((c1 - c0 + 1) * DOT_W)}v${DOT_H}h${f(-(c1 - c0 + 1) * DOT_W)}z`).join("");
}

// ---------------------------------------------------------------- le retour haptique et la molette, repris d'index.html
const Haptics = (() => {
  const coarse = typeof matchMedia === "function" && matchMedia("(pointer: coarse)").matches;
  let label = null, last = 0;
  function ios() {
    if (!label) {
      label = document.createElement("label");
      label.setAttribute("aria-hidden", "true");
      label.style.cssText = "position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none";
      const input = document.createElement("input");
      input.type = "checkbox"; input.tabIndex = -1; input.setAttribute("switch", "");
      label.appendChild(input);
      document.body.appendChild(label);
    }
    const had = document.activeElement;
    label.click();
    if (had && had !== document.activeElement && had.focus) had.focus({ preventScroll: true });
  }
  function fire(ms, gap) {
    const tt = performance.now();
    if (tt - last < gap) return;
    last = tt;
    try { if ("vibrate" in navigator) navigator.vibrate(ms); else if (coarse) ios(); } catch { /* not allowed here */ }
  }
  return { tick: () => fire(6, 28), bump: () => fire(16, 0) };
})();
class Encoder {
  constructor() { this.reset(); }
  reset() { this.acc = 0; this.dir = 0; this.v = 0; this.t = 0; }
  speed(n, tt, tau) {
    const dt = this.t ? Math.max(1, tt - this.t) : 1000;
    this.t = tt;
    const inst = (Math.abs(n) * 1000) / dt, k = 1 - Math.exp(-dt / tau);
    this.v += (inst - this.v) * k;
  }
  feed(travel, tt) {
    if (!travel) return 0;
    this.speed(travel, tt, 90);
    const s = Math.sign(travel);
    if (this.dir && s !== this.dir && Math.sign(this.acc) !== s) this.acc = 0;
    this.acc += travel;
    let n = 0;
    for (;;) {
      const d = Math.sign(this.acc);
      if (!d) break;
      const need = !this.dir ? 1.35 : d !== this.dir ? 1.25 : 1;
      if (Math.abs(this.acc) < need) break;
      this.acc -= d * need; this.dir = d; n += d;
    }
    return n;
  }
  step(n, tt, tau = 220) { this.speed(n, tt, tau); this.dir = Math.sign(n); return n; }
}

<script id="sample-engine">
// Module sample et scratch : le moteur côté page (son contexte audio, son worklet, ce qu'il renvoie).
"use strict";
class SampleEngine {
  constructor() {
    this.on = false; this.playing = false; this.name = t("name");
    this.pos = { beats: 0, loop: 0, slice: -1, disc: 0, bpm: 120, playing: false };
    this.master = 0.8;
  }
  async start() {
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch { /* Safari d'avant */ }
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC({ latencyHint: "interactive" });
    const src = $("sample-lib").textContent + "\n" + $("sample-worklet").textContent;
    await this.ac.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    this.node = new AudioWorkletNode(this.ac, "sample", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    this.an = this.ac.createAnalyser(); this.an.fftSize = 2048;
    this.node.connect(this.an); this.an.connect(this.ac.destination);
    this.node.port.onmessage = ({ data: m }) => {
      if (m.t === "ended") { this.playing = false; return; }
      if (m.t !== "pos") return;
      this.pos = m; this.posAt = performance.now();
      if (m.playing) this.greenAt = performance.timeOrigin + performance.now();   // (le Duo : qui joue)
    };
    await this.ac.resume().catch(() => {});
    this.on = true;
    this.send({ t: "master", v: this.master });
    if (this.sample) this.load(this.sample);
  }
  async stop() {
    this.on = false; this.playing = false;
    try { await this.ac.close(); } catch { /* déjà fermé */ }
    this.ac = this.node = this.an = null;
  }
  send(m, transfer) { if (this.node) this.node.port.postMessage(m, transfer || []); }

  // demandent le moins de changement de vitesse au tempo du moment
  load(s) {
    const frames = s.ch[0].length;
    if (!s.slices) s.slices = sliceBounds(frames);
    if (s.bars === undefined) s.bars = fitBars(frames / s.rate, this.pos.bpm || 120).bars;
    this.sample = s;
    this.send({ t: "load", ch: s.ch.map((c) => c.slice()), rate: s.rate, slices: s.slices.slice(), bars: s.bars });
  }
  play(on) { this.playing = on; this.send({ t: "play", on }); }

S.hooks.knob.push((name, n) => {

// Le Duo lit ce module comme un moteur de firmware : on, name, entry, midiIn, playLight, greenAt.
eng.entry = { id: "sample", nom: t("name"), natif_horloge: true, demarre: true };

S.clock = makeClock();
const duoLinked = () => { try { return !!(FM1_ID && parent.__duo && parent.__duo.linked); } catch { return false; } };
let ownBpm = Math.max(40, Math.min(240, Number(keep("bpm")) || 120));
Object.defineProperty(S, "bpm", {
  get: () => ownBpm,

});
eng.midiIn = (bytes) => {

S.loopLength = () => { const s = eng.sample; return !s ? 4 : s.bars ? s.bars * 4 : ((s.ch[0].length / s.rate) * eng.pos.bpm) / 60; };

// PLAY : lié, il lance et arrête les deux par la page du Duo ; seul, il joue à son tempo
S.hooks.cap.push((name, down) => {
  if (name !== "PLAY" || !down || !eng.on) return;

<script id="sample-gestures">

  S.touch.platter = plat.size;
  if (plat.size === 1) {                               // la main sur le disque : il s'arrête sous elle
    clearTimeout(revTimer);

const keyCap = { Space: "PLAY", KeyR: "REC", KeyE: "EDIT" };
function pressKey(code, down) {

  if (pad >= 0) { panel.pads[pad].g.classList.toggle("held", down); fire("pad", pad, down); return true; }

addEventListener("keydown", (e) => {

S.onMidi = (bytes) => {

    const st = bytes[i] & 0xf0, note = bytes[i + 1], vel = bytes[i + 2];
    if ((st === 0x90 || st === 0x80) && i + 2 < bytes.length && note >= 36 && note <= 51) {

<script id="sample-lights">
// Module sample et scratch : les lumières, à chaque image. Comme sur le FM-1, chaque LED a son intensité --i (0 à 1).
// Pads : la tranche que joue la boucle, avec une traînée qui s'éteint, la tranche choisie faiblement allumée ;
// couronne : la LED en face du repère du disque et sa traînée ; PLAY bat la mesure ; REC clignote armé, fixe en
// enregistrement ; zone XY : un point lumineux sous chaque doigt.
"use strict";
S.lit = { slice: -1, disc: 0 };
const padI = new Float32Array(16);
const setI = (el, v) => { const s = v.toFixed(3); if (el.__i !== s) { el.__i = s; el.style.setProperty("--i", s); } };

function lights() {
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  const on = S.on && eng.on, p = eng.pos, playing = on && eng.playing;
  // les pads
  const sl = on && eng.sample && (playing || S.touch.platter) ? p.slice : -1;
  for (let i = 0; i < 16; i++) {
    if (i === sl) padI[i] = 1;
    else padI[i] *= Math.exp(-dt / 0.1);
    const rest = on && i === S.slice && eng.sample ? 0.25 : 0;
    setI(panel.pads[i].g, Math.max(padI[i] < 0.004 ? 0 : padI[i], rest));
  }
  S.lit.slice = sl;

  const disc = on && eng.sample ? p.disc : 0;
  S.lit.disc = disc;
  panel.disc.setAttribute("transform", `rotate(${((disc * 180) / Math.PI).toFixed(2)} ${panel.center.platter[0]} ${panel.center.platter[1]})`);

    const back = (head - i + 32) % 32;

  });

      const pt = el("g", { class: "pt" });
      pt.append(
        el("line", { x1: rx, y1: y, x2: rx + rw, y2: y, class: "sk-lcd-acc", stroke: S.T.acc, "stroke-opacity": 0.45, "stroke-width": 1.4 }),

        el("circle", { cx: x, cy: y, r: 58, fill: "url(#gTouch)", opacity: 0.55 }),
        el("circle", { cx: x, cy: y, r: 10, fill: "#ffffff" }));

</script>
<script id="sample-send">
// Module sample et scratch : l'envoi. SEND ouvre la page Envoi, SEND encore envoie ; remplacer la banque de Pigeon et
// effacer un sample demandent une confirmation (un troisième SEND).
"use strict";
S.sendArmed = false;
function fm1ATarget() {

}
S.targets = () => { const t = fm1ATarget(); return t ? [t, "file", "erase"] : ["file", "erase"]; };
S.sendLine = () => {
  const s = curSample(), id = s ? s.id : "";

    case "zp12": return "16 slices to zp12 pads C1-D8";

  }
};
// une tranche telle que les pads la jouent (début, longueur, hauteur, gain), ou le son propre d'un pad, en .wav ;
// au plus `max` secondes
function sliceChannels(s, k) {
  const c = s.cols[k], own = s.pads[k], rate = own ? own.rate : s.rate;
  let src;
  if (own) src = own.ch;
  else {
    const a = Math.max(0, s.slices[k] + Math.round((c.start / 1000) * rate));
    const e = Math.min(s.ch[0].length, c.len ? a + Math.round((c.len / 1000) * rate) : s.slices[k + 1]);
    src = s.ch.map((x) => x.subarray(a, Math.max(a, e)));
  }
  const ratio = Math.pow(2, (c.pitch || 0) / 12), g = (c.gain == null ? 100 : c.gain) / 100, n = Math.max(1, Math.floor(src[0].length / ratio));
  return { rate, ch: src.map((x) => { const y = new Float32Array(n); for (let i = 0; i < n; i++) { const p = i * ratio, i0 = Math.floor(p), f = p - i0; y[i] = ((x[i0] || 0) * (1 - f) + (x[i0 + 1] || 0) * f) * g; } return y; }) };
}
S.sliceWav = (s, k, max) => {
  const { rate, ch } = sliceChannels(s, k);
  return encodeWav(max ? ch.map((x) => x.subarray(0, Math.min(x.length, Math.floor(max * rate)))) : ch, rate);
};
// Pigeon : la chanson d'abord (au moins 2,05 s : Pigeon prend pour chanson ce qui dure 2 s), puis les seize pads (moins de 2 s)
S.pigeonFiles = (s) => {
  const min = Math.ceil(2.05 * s.rate), song = s.ch[0].length >= min ? s.ch : s.ch.map((x) => { const y = new Float32Array(min); y.set(x); return y; });
  const files = [{ bytes: encodeWav(song, s.rate), name: `${s.id}.wav` }];
  for (let k = 0; k < 16; k++) files.push({ bytes: S.sliceWav(s, k, 1.9), name: `${s.id}-${String(k + 1).padStart(2, "0")}.wav` });
  return files;
};
S.send = async (target) => {
  const s = curSample();
  if (!s) { setNote("No sample"); return S.note; }
  if (target === "file") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([encodeWav(s.ch, s.rate)], { type: "audio/wav" }));
    a.download = s.id + ".wav";
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setNote(`Saved ${s.id}.wav`);
    return S.note;
  }
  if (target === "erase") { const id = s.id; await S.erase(s); setNote(`${id} erased`); return S.note; }
  const A = S.fm1A();
  if (!A || fm1ATarget() !== target) { setNote("FM1-A can't take samples"); return S.note; }
  const F = A.w.File, mk = (f) => new F([f.bytes], f.name, { type: "audio/wav" });
  const list = target === "pigeon" ? S.pigeonFiles(s)
    : Array.from({ length: 16 }, (_, k) => ({ bytes: S.sliceWav(s, k), name: `${s.id}-${String(k + 1).padStart(2, "0")}.wav` }));
  setNote("Sending…");
  try {
    const r = await A.w.__takeSamples(list.map(mk));         // la réponse de FM1-A, telle que sa ligne d'état l'affiche
    const text = (r && r.text) || "";
    setNote(text || (r && r.ok === false ? "Not sent" : "Sent"));
    return text;
  } catch (err) { setNote("Not sent: " + ((err && err.message) || err)); return S.note; }
};
S.hooks.cap.push((name, down) => {
  if (name !== "SEND" || !down || !S.on) return;
  if (S.page !== "send") { S.page = "send"; S.col = null; S.sendArmed = false; setNote(""); return; }
  const list = S.targets();
  if (!list.includes(S.target)) S.target = list[0];
  if ((S.target === "pigeon" || S.target === "erase") && !S.sendArmed) { S.sendArmed = true; drawScreen(); return; }
  S.sendArmed = false;
  S.send(S.target);
});
S.hooks.knob.push(() => { if (S.page === "send") S.sendArmed = false; });   // changer de cible annule la confirmation
</script>
