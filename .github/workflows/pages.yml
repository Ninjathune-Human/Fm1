# Compile le cœur d'émulation fm1-emu (MIT, Joakim Eriksson) au commit figé, compile depuis leurs sources
# les firmwares qui ont une version navigateur (tools/natif.json, une tâche par firmware : ceux qui échouent
# restent émulés), assemble le site, joint runtime/ et natif/ à des versions GitHub, et publie depuis main.
name: Site

on:
  push:
    branches: [main, natif]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  FM1_EMU_COMMIT: 1c8661daa1bbfddbb7d32d927bbaf831343b7d3b
  RUNTIME_TAG: runtime-1c8661d
  EMSDK_VERSION: 3.1.64
  NATIF_TAG: natif

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      firmwares: ${{ steps.l.outputs.firmwares }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "firmwares=$(jq -c '.firmwares' tools/natif.json)" >> "$GITHUB_OUTPUT"

  natif:
    needs: liste
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.liste.outputs.firmwares) }}
    name: natif ${{ matrix.firmware.id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: fm1
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.firmware.depot }}
          ref: ${{ matrix.firmware.commit }}
          path: src
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilation depuis les sources
        run: |
          pip install pillow fonttools numpy
          bash fm1/tools/natif_build.sh "${{ matrix.firmware.id }}" src "${{ matrix.firmware.script }}" out
      - uses: actions/upload-artifact@v4
        with:
          name: natif-${{ matrix.firmware.id }}
          path: out
          if-no-files-found: ignore

  build:
    needs: natif
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: natif-*
          path: _site/natif
          merge-multiple: true

      - uses: actions/checkout@v4
        with:
          repository: joakimeriksson/fm1-emu
          ref: ${{ env.FM1_EMU_COMMIT }}
          path: fm1-emu

      - name: Cible WebAssembly
        run: rustup target add wasm32-unknown-unknown

      - name: Compilation du cœur
        working-directory: fm1-emu
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          RUSTFLAGS: -Cllvm-args=-inline-threshold=2000 -Clink-arg=--export-table -Clink-arg=--growable-table
        run: cargo build --release -p fm1-web --target wasm32-unknown-unknown --target-dir target/wasm

      - name: Assemblage du site
        run: |
          mkdir -p _site/runtime
          cp index.html engine.js _site/
          for d in firmwares assets; do [ -d "$d" ] && cp -r "$d" _site/; done
          cp fm1-emu/target/wasm/wasm32-unknown-unknown/release/fm1_web.wasm _site/runtime/
          cp fm1-emu/web/worklet.js fm1-emu/web/persistence.js _site/runtime/
          # écran envoyé 60 fois par seconde au lieu de 30 (seule modification du fichier de fm1-emu)
          sed -i 's#sampleRate / 30#sampleRate / 60#' _site/runtime/worklet.js
          grep -q 'sampleRate / 60' _site/runtime/worklet.js
          cp fm1-emu/LICENSE _site/runtime/LICENSE-fm1-emu.txt
          ls -la _site/runtime
          # la liste des firmwares natifs prêts, lue par la page : {id: {wasm, processeur, dialecte}}
          mkdir -p _site/natif
          python3 -c "import json,glob,os; m={os.path.basename(os.path.dirname(f)): json.load(open(f)) for f in sorted(glob.glob('_site/natif/*/natif.json'))}; json.dump(m, open('_site/natif/manifest.json','w'), indent=1); print(len(m), 'natifs :', ' '.join(f'{k}({v[\"dialecte\"]})' for k,v in m.items()))"
          tar -czf natif.tar.gz -C _site natif

      - name: Version runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Cœur fm1-emu ${FM1_EMU_COMMIT:0:7}" \
              --notes "fm1_web.wasm compilé depuis joakimeriksson/fm1-emu@${FM1_EMU_COMMIT} (MIT), avec worklet.js et persistence.js."
          gh release upload "$RUNTIME_TAG" _site/runtime/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$NATIF_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$NATIF_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Firmwares natifs" \
              --notes "Les firmwares de tools/natif.json compilés depuis leurs sources pour le navigateur (chacun sous la licence de son auteur, jointe)."
          gh release upload "$NATIF_TAG" natif.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
