# Essais de vitesse du cœur fm1-emu : profil du temps par fonction, puis les variantes (tools/fm1emu_perf.py), vérifiées octet pour octet
# contre le cœur publié. N'est lancé que sur la branche d'essai ; ne publie rien.
name: Perf

on:
  push:
    branches: [essai-perf]
  workflow_dispatch:

env:
  FM1_EMU_COMMIT: 60645a58d6cd1597ed565a3f00e4981964623232

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joakimeriksson/fm1-emu
          ref: ${{ env.FM1_EMU_COMMIT }}
          path: fm1-emu
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup target add wasm32-unknown-unknown
      - name: Patchs du site
        run: |
          python3 tools/fm1emu_vert.py fm1-emu fm1-emu/web/worklet.js
          python3 tools/fm1emu_usb.py fm1-emu fm1-emu/web/worklet.js
      - name: Cœur publié, avec les noms des fonctions
        working-directory: fm1-emu
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: 1
          RUSTFLAGS: -Clink-arg=--export-table -Clink-arg=--growable-table
        run: cargo build --release -p fm1-web --target wasm32-unknown-unknown --target-dir target/named 2>&1 | tail -2
      - name: Profil du temps (node --cpu-prof)
        working-directory: fm1-emu
        run: |
          W=$PWD/target/named/wasm32-unknown-unknown/release/fm1_web.wasm
          for f in melodee dark1; do
            rm -rf /tmp/prof; mkdir /tmp/prof
            FM1_WASM=$W FM1_FWSC=../firmwares/$f.fwsc node --cpu-prof --cpu-prof-dir=/tmp/prof web/bench.mjs 100 8 > /tmp/bench.out 2>&1
            echo "### temps $f"; grep -i "realtime\|x " /tmp/bench.out | head -2
            python3 ../tools/prof_report.py /tmp/prof/*.cpuprofile
          done
