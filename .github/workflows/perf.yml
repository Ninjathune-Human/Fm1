# Essais de vitesse du cœur fm1-emu : profil du temps par fonction, puis les variantes (tools/fm1emu_perf.py), vérifiées octet pour octet
# contre le cœur publié. N'est lancé que sur la branche d'essai ; ne publie rien.
name: Perf

on:
  push:
    branches: [essai-perf]
  workflow_dispatch:

env:
  FM1_EMU_COMMIT: 60645a58d6cd1597ed565a3f00e4981964623232

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joakimeriksson/fm1-emu
          ref: ${{ env.FM1_EMU_COMMIT }}
          path: fm1-emu
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup target add wasm32-unknown-unknown
      - name: Coût de chaque firmware émulé (cœur publié)
        working-directory: fm1-emu
        run: |
          curl -fsSL -o ../base.wasm https://ninjathune-human.github.io/Fm1/runtime/fm1_web.wasm
          while read id file; do
            FM1_WASM=../base.wasm FM1_FWSC=../$file FM1_BENCH_JSON=/tmp/b.json timeout 120 node web/bench.mjs 100 6 > /dev/null 2>&1 || { echo "COUT $id échec"; continue; }
            python3 -c "import json; j=json.load(open('/tmp/b.json')); print('COUT $id', round(j['steadyRealtime'],2), 'max', round(j['steadyRenderMs']['max']), 'ms')"
          done < ../tools/emules.txt | sort -k3 -n
